<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeriRag — Create Account</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --primary-color: #2563eb;
            --border-color: #e2e8f0;
            --text-muted: #64748b;
            --danger-color: #ef4444;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            padding: 2rem 1rem;
            box-sizing: border-box;
        }
        .card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 440px;
            border-top: 6px solid var(--primary-color);
        }
        .form-control { display: flex; flex-direction: column; gap: 0.5rem; }
        label { font-size: 0.875rem; font-weight: 600; }
        input {
            padding: 0.75rem; border-radius: 0.5rem; border: 1px solid var(--border-color);
            background-color: #f8fafc; color: var(--text-color); font-size: 0.95rem;
        }
        input:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 0.75rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer;
            border: none; background-color: var(--primary-color); color: white; font-size: 1rem;
            margin-top: 0.5rem; width: 100%;
        }
        .btn:hover { opacity: 0.9; }
        .hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.2rem; }
        .alert-error {
            color: var(--danger-color); text-align: center; background: #fee2e2;
            padding: 0.5rem; border-radius: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div style="text-align:center; margin-bottom:1.5rem;">
            <img src="/static/logo.png" alt="VeriData" style="height:52px; width:auto; opacity:0.9;">
        </div>

        <h1 style="margin:0 0 0.25rem; font-size:1.4rem;">Create your workspace</h1>
        <p style="margin:0 0 1.5rem; font-size:0.875rem; color:var(--text-muted);">
            Start your 30-day free trial — no credit card required.
        </p>

        <form action="/register" method="post" style="display:flex; flex-direction:column; gap:1.1rem;">
            <div class="form-control">
                <label>Full Name</label>
                <input type="text" name="full_name" placeholder="Jane Smith" autocomplete="name">
            </div>
            <div class="form-control">
                <label>Work Email <span style="color:red">*</span></label>
                <input type="email" name="email" required autocomplete="email">
            </div>
            <div class="form-control">
                <label>Password <span style="color:red">*</span></label>
                <input type="password" name="password" required minlength="8" autocomplete="new-password">
                <span class="hint">Minimum 8 characters</span>
            </div>
            <div class="form-control">
                <label>Workspace Name <span style="color:red">*</span></label>
                <input type="text" name="tenant_slug" required placeholder="my-company"
                    pattern="[a-z0-9\-]+" title="Lowercase letters, numbers and hyphens only">
                <span class="hint">Lowercase letters, numbers and hyphens only (e.g. acme-corp)</span>
            </div>
            <button type="submit" class="btn">Create Workspace</button>
            {% if error %}
            <p class="alert-error">{{ error }}</p>
            {% endif %}
        </form>

        <div style="margin-top:1.5rem; text-align:center; font-size:0.875rem; color:var(--text-muted);">
            Already have an account?
            <a href="/login" style="color:var(--primary-color); font-weight:600;">Sign in</a>
        </div>

        <div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--border-color); text-align:center; font-size:0.85rem; color:var(--text-muted);">
            &copy; 2025 VeriData. All rights reserved.
        </div>
    </div>
</body>
</html>
