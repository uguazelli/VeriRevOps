<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeriRag Core</title>
    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <!-- App styles -->
    <link rel="stylesheet" href="/static/app.css">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .spinner {
            animation: rotate 2s linear infinite;
            width: 1.25rem;
            height: 1.25rem;
            display: inline-block;
            vertical-align: middle;
        }

        .spinner .path {
            stroke: currentColor;
            stroke-linecap: round;
            animation: dash 1.5s ease-in-out infinite;
        }

        @keyframes rotate {
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes dash {
            0% {
                stroke-dasharray: 1, 150;
                stroke-dashoffset: 0;
            }

            50% {
                stroke-dasharray: 90, 150;
                stroke-dashoffset: -35;
            }

            100% {
                stroke-dasharray: 90, 150;
                stroke-dashoffset: -124;
            }
        }

        .loading-indicator {
            display: none;
        }

        .htmx-request .loading-indicator {
            display: inline-block;
        }

        .htmx-request.btn-disabled {
            pointer-events: none;
            opacity: 0.7;
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-900 font-sans antialiased h-screen flex flex-col md:flex-row overflow-hidden">
    <div class="flex flex-col md:flex-row w-full h-full relative">
        {% block content %}{% endblock %}
    </div>
</body>

</html>
