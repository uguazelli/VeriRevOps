services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veridata.revops
    restart: unless-stopped
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${APP_PORT:-4019}:8000"
    volumes:
      - ./app:/app/app # Hot reload
    networks:
      veridata.network:
        aliases:
          - veridata.revops

networks:
  veridata.network:
    external: true
