name: gateway

services:
  etcd:
    image: bitnamilegacy/etcd:latest
    container_name: veridata.etcd
    restart: always
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    ports:
      - "2379:2379"
    volumes:
      - etcd_data:/bitnami/etcd
    networks:
      veridata.network:
        aliases:
          - veridata.etcd

volumes:
  etcd_data:

networks:
  veridata.network:
    external: true
