{% extends "base.html" %}

{% block title %}Profile Dashboard{% endblock %}

{% block content %}
    <span class="success-icon">✨</span>
    <h2>It works!</h2>
    <p style="margin-bottom: 30px; color: var(--text-muted); line-height: 1.5;">
        Welcome back, <strong>{{ username }}</strong>.<br>
        You have successfully logged in via session auth.
    </p>
    
    <form action="/logout" method="POST">
        <button type="submit" style="background: rgba(255,255,255,0.1); border: 1px solid var(--border);">Logout</button>
    </form>
{% endblock %}
